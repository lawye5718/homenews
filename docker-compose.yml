version: '3.8'

# Simplified docker-compose for backend API (optional service)
# The main functionality is the AI news agent (agent_main.py) which runs independently via GitHub Actions

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./homenews.db
    volumes:
      - ./backend:/app
    networks:
      - homenews-network

networks:
  homenews-network:
    driver: bridge
