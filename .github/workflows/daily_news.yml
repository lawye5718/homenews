name: Daily News Agent

on:
  schedule:
    # 每天北京时间 04:00 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动按钮触发

# 🔥 关键：赋予 GITHUB_TOKEN 写权限，否则无法推送到 gh-pages 分支
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 安装依赖
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install 'crewai[tools]' langchain-openai python-dotenv

      # 运行智能体脚本
      - name: Run CrewAI Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # 有些版本的 CrewAI/LangChain 可能会检查 OPENAI_API_KEY，即使我们用的是 DeepSeek
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com"
        run: python agent_main.py

      # 检查 HTML 是否生成
      - name: Verify HTML generation
        run: |
          if [ -f "index.html" ]; then
            echo "✅ HTML generated successfully."
            cat index.html | head -n 20 # 显示生成的HTML前20行
          else
            echo "❌ HTML not found! Agent failed to produce output."
            exit 1
          fi

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
