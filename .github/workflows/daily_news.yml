name: Daily News Agent

"on":
  schedule:
    - cron: '0 23 * * *'  # 建议调整：UTC 23:00 是北京时间早上 7:00，适合发日报
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ✅ 修复点：直接安装 requirements.txt，确保 fastapi 等依赖被包含
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CrewAI Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com"
        run: python agent_main.py

      - name: Verify HTML generation
        run: |
          if [ -f "index.html" ]; then
            echo "✅ HTML generated successfully."
            # 打印前50行以检查是否有 <!DOCTYPE html> 和头部信息
            head -n 50 index.html
          else
            echo "❌ HTML not found! Agent failed to produce output."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
