name: Daily News Agent

on:
  schedule:
    # 北京时间 03:00 = UTC 19:00 (前一天)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 修复：直接使用清理后的 requirements.txt 安装
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CrewAI Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # 兼容性设置：某些组件可能检查 OPENAI_API_KEY
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: "https://api.deepseek.com"
        run: python agent_main.py

      - name: Verify HTML generation
        run: |
          if [ -f "index.html" ]; then
            echo "✅ HTML generated successfully."
            head -n 20 index.html 
          else
            echo "❌ HTML not found! Agent failed to produce output."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
